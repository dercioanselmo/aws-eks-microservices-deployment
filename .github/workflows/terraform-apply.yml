name: "TF-04_EC2_Basic-Manual-Apply"

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running terraform apply'
        required: true
        default: 'no'

jobs:
  apply:
    name: "Manual Terraform Apply (04_EC2_Basic)"
    runs-on: ubuntu-latest
    environment:
      name: 04-EC2-Basic-Apply
    if: ${{ github.event.inputs.confirm == 'yes' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
    defaults:
      run:
        working-directory: 04_EC2_Basic
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (confirmed)
        run: terraform apply -auto-approve

      - name: Notify: create issue about apply
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Terraform apply executed for 04_EC2_Basic by ${context.actor}`;
            const body = `@dercioanselmo\n\nUser @${context.actor} ran a manual Terraform apply on ref ${context.ref}.\n\nRun: ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}\n\nIf you need to revoke or investigate, check the run logs.`;
            await github.rest.issues.create({ owner, repo, title, body, assignees: ['dercioanselmo'] });
