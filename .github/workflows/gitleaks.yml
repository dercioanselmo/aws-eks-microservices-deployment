name: "GitLeaks Terraform Secret Scan"

permissions:
  contents: read
  issues: write

on:
  push:
    branches:
      - main
    paths:
      - '04_EC2_Basic/**'
  pull_request:
    paths:
      - '04_EC2_Basic/**'

jobs:
  gitleaks:
    name: "Run GitLeaks on Terraform changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitLeaks (generate JSON report)
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source=04_EC2_Basic --report-path=./gitleaks-report.json --report-format=json || true

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      - name: Evaluate gitleaks report
        run: |
          python3 - <<'PY'
import json,sys,os
path='gitleaks-report.json'
if not os.path.exists(path):
    print('No gitleaks report found, assuming no leaks or action failed to run')
    sys.exit(0)
data=json.load(open(path))
if isinstance(data, list) and len(data)>0:
    print(f'GITLEAKS: FOUND {len(data)} items')
    for i,item in enumerate(data[:10]):
        print(f"{i+1}. {item.get('rule','')} - {item.get('path','')} - {item.get('line', '')}")
    sys.exit(1)
print('GITLEAKS: no leaks detected')
PY

      - name: Create issue when leaks found
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const reportPath = './gitleaks-report.json';
            if (!fs.existsSync(reportPath)) {
              core.info('No report found');
              return;
            }
            const data = JSON.parse(fs.readFileSync(reportPath,'utf8'));
            const leaks = Array.isArray(data) ? data : [];
            const title = `Potential secret leak detected in 04_EC2_Basic (${leaks.length} items)`;
            let body = `@dercioanselmo\n\nGitLeaks detected ${leaks.length} potential secrets in the 04_EC2_Basic project. Please review immediately.`;
            body += `\n\nTop findings:\n`;
            body += leaks.slice(0,10).map(l => `- ${l.path} (rule: ${l.rule || l.description || ''})`).join('\n');
            body += `\n\nFull report is attached as workflow artifact: gitleaks-report`;
            await github.rest.issues.create({ owner, repo, title, body, assignees: ['dercioanselmo'] });
