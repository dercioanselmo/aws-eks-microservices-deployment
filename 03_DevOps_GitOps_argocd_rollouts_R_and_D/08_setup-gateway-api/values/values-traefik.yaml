# Configure Network Ports and EntryPoints
ports:
  web:
    port: 80
    # nodePort is ignored when using LoadBalancer

  traefik:                  # Dashboard / API port
    port: 8080
    expose:
      default: true
    # nodePort: 30002     # Only uncomment if you use NodePort type

# Enable Dashboard
api:
  dashboard: true
  insecure: true

# Service Type
service:
  enabled: true
  spec:
    type: LoadBalancer      # ← This is what we want now

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`dashboard.localhost`)
    entryPoints:
      - web

ingressClass:
  enabled: false

providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gateway:
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

logs:
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true