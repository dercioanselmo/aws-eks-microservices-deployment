---
- name: Common Kubernetes Node Setup (Both Control Plane & Worker)
  hosts: k8s_cluster
  become: yes
  tasks:

    - name: Fix apt_pkg and command-not-found issue
      shell: |
        sudo apt-get install --reinstall -y python3-apt command-not-found
        sudo mv /etc/apt/apt.conf.d/50command-not-found /etc/apt/apt.conf.d/50command-not-found.disabled 2>/dev/null || true
      args:
        creates: /etc/apt/apt.conf.d/50command-not-found.disabled

    - name: Update and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        cache_valid_time: 3600

    - name: Disable swap immediately
      command: swapoff -a
      changed_when: false

    - name: Disable swap permanently
      replace:
        path: /etc/fstab
        regexp: '^(\s*[^#].*?\s+swap\s+.*)$'
        replace: '# \1'

    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg2
          - software-properties-common
          - apt-transport-https
          - ca-certificates
        state: present

    - name: Install containerd
      apt:
        name: containerd.io
        state: present

    - name: Configure containerd
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes