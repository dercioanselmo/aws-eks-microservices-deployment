---
- name: Raw Bootstrap - Install Python 3.10
  hosts: k8s_cluster
  gather_facts: false
  connection: paramiko_ssh

  tasks:

    - name: Install prerequisites and add deadsnakes PPA
      raw: |
        sudo apt update -qq && \
        sudo apt install -y software-properties-common curl && \
        sudo add-apt-repository ppa:deadsnakes/ppa -y

    - name: Update apt and install Python 3.10 (full command)
      raw: |
        sudo apt update -qq && \
        sudo apt install -y python3.10 python3.10-venv python3.10-dev python3-pip
      register: install_result
      ignore_errors: yes

    - name: Show installation result
      debug:
        msg: "{{ install_result.stdout | default('No output') }}"
      when: install_result is defined