---
- name: Bootstrap Python 3.10 on Ubuntu 20.04
  hosts: k8s_cluster
  become: yes
  gather_facts: false   # Important: Skip facts gathering because Python is too old

  tasks:

    - name: Install prerequisites
      apt:
        name:
          - software-properties-common
          - curl
        state: present
        update_cache: yes

    - name: Add deadsnakes PPA for newer Python
      apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present

    - name: Install Python 3.10
      apt:
        name:
          - python3.10
          - python3.10-venv
          - python3.10-dev
          - python3-pip
        state: present
        update_cache: yes

    - name: Install pip for Python 3.10
      command: python3.10 -m ensurepip --upgrade
      changed_when: false

    - name: Upgrade pip
      command: python3.10 -m pip install --upgrade pip
      changed_when: false